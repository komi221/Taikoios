name: TaikoMobile
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TaikoMobile:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/neiro_1_don.ogg
        buildPhase: resources
      - path: Resources/neiro_1_ka.ogg
        buildPhase: resources
      - path: Resources/Original
        buildPhase: resources
        type: folder
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Taiko
        UILaunchScreen: {}
        UIAppFonts:
          - Original/fonts/TnT.ttf
          - Original/fonts/Kozuka.otf
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.taikomobile
        SWIFT_OBJC_BRIDGING_HEADER: Config/Bridging-Header.h
        CODE_SIGNING_ALLOWED: NO
        ENABLE_PREVIEWS: NO
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
