name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch stb_vorbis
        run: bash scripts/fetch_deps.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project TaikoMobile.xcodeproj -scheme TaikoMobile \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TaikoMobile.app Payload/
          zip -qr TaikoMobile.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TaikoMobile-ipa
          path: TaikoMobile.ipa
